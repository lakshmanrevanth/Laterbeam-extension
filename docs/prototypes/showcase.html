<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Laterbeam showcase</title>
  <link rel="stylesheet" href="showcase.css" />
</head>
<body>
  <!-- Rendered to docs/screenshots/hero.png by `npm run screenshots` (after the other shots). -->
  <div class="stage">
    <div class="copy">
      <div class="brand"><img src="../../web/public/icons/icon.svg" alt="" width="52" height="52" /><span>Laterbeam</span></div>
      <h1>Beam it now.<br />Open it later.</h1>
      <p>Links from Chrome and any app on your phone, in one private space. No passwords. Live sync. Works offline.</p>
      <ul>
        <li>Chrome extension</li>
        <li>Android share sheet</li>
        <li>Installable web app</li>
      </ul>
    </div>
    <div class="devices">
      <figure class="browser">
        <div class="bar"><i></i><i></i><i></i><span>laterbeam.web.app</span></div>
        <img src="../screenshots/desktop-list.png" alt="" />
      </figure>
      <figure class="phone p1"><img src="../screenshots/mobile-list.png" alt="" /></figure>
      <figure class="phone p2"><img src="../screenshots/mobile-item.png" alt="" /></figure>
    </div>
  </div>
</body>
</html>
